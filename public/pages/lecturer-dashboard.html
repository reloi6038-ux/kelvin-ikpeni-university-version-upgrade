<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Lecturer dashboard at Kelvin Ikpeni University." />
  <title>Lecturer Dashboard | Kelvin Ikpeni University</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body data-page="lecturer-dashboard">
  <header class="site-header"><div class="container header__inner">
    <a href="/" class="logo"><span class="logo__crest">K</span><span class="logo__text"><span class="logo__name">Kelvin Ikpeni</span><span class="logo__sub">University</span></span></a>
    <nav class="main-nav">
      <a href="/" class="nav-link">Home</a>
      <a href="/pages/library.html" class="nav-link">Library</a>
    </nav>
    <div class="header__actions" data-auth-actions></div>
    <button class="nav-toggle" aria-label="Toggle navigation"><i class="fas fa-bars"></i></button>
  </div></header>

  <section class="page-hero">
    <div class="container">
      <span class="section-label" style="color:var(--color-accent);">Lecturer Portal</span>
      <h1 style="color:#fff;" id="welcomeName">Welcome</h1>
      <p>Manage your courses, review students, and upload results.</p>
    </div>
  </section>

  <section class="section section--lg">
    <div class="container">
      <div id="lecturerLoading" class="loading-state">
        <span class="spinner spinner--dark spinner--lg"></span>
        <span>Loading your dashboard…</span>
      </div>
      <div id="lecturerBody" class="hidden">
        <div class="grid grid--3 mb-6" id="lecturerStats"></div>
        <div class="card" style="padding:var(--space-6);">
          <h3 style="margin-bottom:var(--space-4);">My Courses</h3>
          <div id="coursesList"></div>
        </div>
      </div>
    </div>
  </section>

  <footer class="site-footer"><div class="container"><div class="footer__bottom" style="border:none;"><div>© <span id="year"></span> Kelvin Ikpeni University.</div></div></div></footer>
  <button class="back-to-top" aria-label="Back to top"><i class="fas fa-arrow-up"></i></button>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/dashboard.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
