<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Forgot Password | Kelvin Ikpeni University</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body data-page="forgot-password" style="display:grid;place-items:center;min-height:100vh;background:var(--gradient-brand);padding-block:var(--space-6);">

  <div style="width:100%;max-width:460px;padding:var(--space-5);">
    <a href="/" class="logo" style="justify-content:center;color:#fff;margin-bottom:var(--space-5);">
      <span class="logo__crest">K</span>
      <span class="logo__text">
        <span class="logo__name" style="background:linear-gradient(135deg,#fff,var(--color-accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;">Kelvin Ikpeni</span>
        <span class="logo__sub" style="color:rgba(255,255,255,0.6);">University</span>
      </span>
    </a>

    <div class="card" style="padding:var(--space-7);border-top:4px solid var(--color-accent);">
      <h1 style="font-size:1.65rem;margin-bottom:var(--space-2);">Forgot Password?</h1>
      <p class="text-muted" style="font-size:var(--fs-sm);margin-bottom:var(--space-6);">
        Enter the email associated with your account. If it exists, we'll send password reset instructions.
      </p>

      <form id="forgotForm">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" required autocomplete="email" />
        </div>
        <button type="submit" class="btn btn--accent btn--lg btn--block" id="forgotBtn">
          <i class="fas fa-paper-plane"></i> Send Reset Link
        </button>
      </form>

      <div id="resetPanel" class="hidden mt-6" style="padding:var(--space-4);background:var(--color-surface-alt);border-radius:var(--radius);border-left:4px solid var(--color-accent);">
        <p style="margin:0;font-size:var(--fs-sm);"><strong>Reset token (development only):</strong></p>
        <p style="font-family:var(--font-mono);font-size:var(--fs-sm);margin-top:.5rem;word-break:break-all;" id="resetToken">—</p>
        <a href="#" id="resetLink" class="btn btn--primary btn--sm mt-3">Go to Reset Page</a>
      </div>

      <div class="text-center mt-5" style="font-size:var(--fs-sm);">
        Remembered it? <a href="/pages/login.html" style="font-weight:600;">Sign in</a>
      </div>
    </div>

    <div class="text-center mt-5">
      <a href="/" style="color:rgba(255,255,255,0.75);font-size:var(--fs-sm);"><i class="fas fa-arrow-left"></i> Back to home</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/auth-pages.js"></script>
</body>
</html>
