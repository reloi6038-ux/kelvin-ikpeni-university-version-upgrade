<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Manage Applications | Admin | Kelvin Ikpeni University</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body data-page="admin-applications">
  <header class="site-header"><div class="container header__inner">
    <a href="/" class="logo"><span class="logo__crest">K</span><span class="logo__text"><span class="logo__name">Kelvin Ikpeni</span><span class="logo__sub">University</span></span></a>
    <nav class="main-nav">
      <a href="/pages/admin-dashboard.html" class="nav-link">Dashboard</a>
      <a href="/pages/admin-users.html" class="nav-link">Users</a>
      <a href="/pages/admin-applications.html" class="nav-link">Applications</a>
      <a href="/pages/admin-content.html" class="nav-link">Content</a>
      <a href="/pages/admin-announcements.html" class="nav-link">Announcements</a>
    </nav>
    <div class="header__actions" data-auth-actions></div>
    <button class="nav-toggle" aria-label="Toggle navigation"><i class="fas fa-bars"></i></button>
  </div></header>

  <section class="page-hero">
    <div class="container">
      <span class="section-label" style="color:var(--color-accent);">Admin</span>
      <h1 style="color:#fff;">Applications</h1>
      <p>Review and process admission applications.</p>
    </div>
  </section>

  <section class="section section--lg">
    <div class="container">
      <div class="filter-bar" style="grid-template-columns:2fr 1fr 1fr;">
        <input type="text" id="appSearch" class="form-control" placeholder="Search by reference, name, or email…" />
        <select id="appStatus" class="form-select">
          <option value="">All Statuses</option>
          <option value="submitted">Submitted</option>
          <option value="under_review">Under Review</option>
          <option value="offered">Offered</option>
          <option value="accepted">Accepted</option>
          <option value="rejected">Rejected</option>
          <option value="withdrawn">Withdrawn</option>
        </select>
        <select id="appLevel" class="form-select">
          <option value="">All Levels</option>
          <option value="undergraduate">Undergraduate</option>
          <option value="postgraduate">Postgraduate</option>
          <option value="online">Online</option>
        </select>
      </div>

      <div class="flex justify-between items-center mb-5 flex-wrap gap-3">
        <div class="text-muted" style="font-size:var(--fs-sm);" id="appsCount">Loading…</div>
      </div>

      <div class="card" style="padding:0;overflow:hidden;">
        <div style="overflow-x:auto;">
          <table style="width:100%;border-collapse:collapse;font-size:var(--fs-sm);">
            <thead style="background:var(--color-surface-alt);">
              <tr style="text-align:left;">
                <th style="padding:.85rem 1rem;">Reference</th>
                <th style="padding:.85rem 1rem;">Applicant</th>
                <th style="padding:.85rem 1rem;">Programme</th>
                <th style="padding:.85rem 1rem;">Level</th>
                <th style="padding:.85rem 1rem;">Status</th>
                <th style="padding:.85rem 1rem;">Submitted</th>
                <th style="padding:.85rem 1rem;text-align:right;">Actions</th>
              </tr>
            </thead>
            <tbody id="appsTbody">
              <tr><td colspan="7" style="padding:var(--space-7);text-align:center;"><span class="spinner spinner--dark"></span></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="flex justify-center gap-3 mt-6" id="appsPagination"></div>
    </div>
  </section>

  <!-- REVIEW APPLICATION MODAL -->
  <div id="reviewModal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:var(--z-modal);display:grid;place-items:center;padding:var(--space-5);">
    <div class="card" style="max-width:720px;width:100%;max-height:85vh;overflow-y:auto;padding:var(--space-6);">
      <div class="flex justify-between items-center mb-5">
        <h3 style="margin:0;">Review Application</h3>
        <button class="btn btn--ghost btn--sm" id="closeReview"><i class="fas fa-xmark"></i></button>
      </div>
      <div id="reviewBody"></div>
      <form id="reviewForm" class="mt-5" style="padding-top:var(--space-5);border-top:1px solid var(--color-border);">
        <input type="hidden" id="reviewAppId" />
        <div class="form-group">
          <label class="form-label">Decision</label>
          <select id="reviewStatus" class="form-select" required>
            <option value="under_review">Mark Under Review</option>
            <option value="offered">Offer Admission</option>
            <option value="accepted">Mark Accepted</option>
            <option value="rejected">Reject</option>
            <option value="withdrawn">Mark Withdrawn</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Notes (optional)</label>
          <textarea id="reviewNotes" class="form-textarea" rows="3"></textarea>
        </div>
        <div class="flex gap-3 flex-wrap">
          <button type="submit" class="btn btn--accent">Save Decision</button>
          <button type="button" class="btn btn--ghost" id="cancelReview">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="site-footer"><div class="container"><div class="footer__bottom" style="border:none;"><div>© <span id="year"></span> Kelvin Ikpeni University.</div></div></div></footer>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/admin.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
