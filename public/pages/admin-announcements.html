<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Manage Announcements | Admin | Kelvin Ikpeni University</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body data-page="admin-announcements">
  <header class="site-header"><div class="container header__inner">
    <a href="/" class="logo"><span class="logo__crest">K</span><span class="logo__text"><span class="logo__name">Kelvin Ikpeni</span><span class="logo__sub">University</span></span></a>
    <nav class="main-nav">
      <a href="/pages/admin-dashboard.html" class="nav-link">Dashboard</a>
      <a href="/pages/admin-users.html" class="nav-link">Users</a>
      <a href="/pages/admin-applications.html" class="nav-link">Applications</a>
      <a href="/pages/admin-content.html" class="nav-link">Content</a>
      <a href="/pages/admin-announcements.html" class="nav-link">Announcements</a>
    </nav>
    <div class="header__actions" data-auth-actions></div>
    <button class="nav-toggle" aria-label="Toggle navigation"><i class="fas fa-bars"></i></button>
  </div></header>

  <section class="page-hero">
    <div class="container">
      <span class="section-label" style="color:var(--color-accent);">Admin</span>
      <h1 style="color:#fff;">Announcements</h1>
      <p>Post and manage university announcements.</p>
    </div>
  </section>

  <section class="section section--lg">
    <div class="container">
      <div class="flex justify-between items-center mb-6 flex-wrap gap-3">
        <div class="text-muted" style="font-size:var(--fs-sm);" id="annCount">Loading…</div>
        <button class="btn btn--accent" id="newAnnBtn"><i class="fas fa-plus"></i> New Announcement</button>
      </div>

      <div class="card" style="padding:var(--space-6);">
        <div id="annList"><div class="loading-state"><span class="spinner spinner--dark"></span></div></div>
      </div>
    </div>
  </section>

  <!-- EDITOR MODAL -->
  <div id="annModal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:var(--z-modal);display:grid;place-items:center;padding:var(--space-5);">
    <div class="card" style="max-width:640px;width:100%;max-height:85vh;overflow-y:auto;padding:var(--space-6);">
      <div class="flex justify-between items-center mb-5">
        <h3 style="margin:0;" id="annModalTitle">New Announcement</h3>
        <button class="btn btn--ghost btn--sm" id="closeAnnModal"><i class="fas fa-xmark"></i></button>
      </div>
      <form id="annForm">
        <input type="hidden" id="annId" />
        <div class="form-group">
          <label class="form-label">Title</label>
          <input type="text" id="annTitle" class="form-control" required maxlength="200" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Category</label>
            <select id="annCategory" class="form-select">
              <option value="general">General</option>
              <option value="academic">Academic</option>
              <option value="admission">Admission</option>
              <option value="event">Event</option>
              <option value="urgent">Urgent</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Audience</label>
            <select id="annAudience" class="form-select">
              <option value="all">All</option>
              <option value="students">Students</option>
              <option value="lecturers">Lecturers</option>
              <option value="applicants">Applicants</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Excerpt</label>
          <textarea id="annExcerpt" class="form-textarea" rows="2" maxlength="400"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Body</label>
          <textarea id="annBody" class="form-textarea" rows="6" required></textarea>
        </div>
        <div class="form-row">
          <div class="form-check" style="align-items:center;">
            <input type="checkbox" id="annPinned" />
            <label for="annPinned" style="font-size:var(--fs-sm);">Pin to top</label>
          </div>
          <div class="form-check" style="align-items:center;">
            <input type="checkbox" id="annPublished" checked />
            <label for="annPublished" style="font-size:var(--fs-sm);">Publish</label>
          </div>
        </div>
        <div class="flex gap-3 flex-wrap mt-3">
          <button type="submit" class="btn btn--accent" id="annSaveBtn">Save Announcement</button>
          <button type="button" class="btn btn--ghost" id="cancelAnn">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="site-footer"><div class="container"><div class="footer__bottom" style="border:none;"><div>© <span id="year"></span> Kelvin Ikpeni University.</div></div></div></footer>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/admin.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
