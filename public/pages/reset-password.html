<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Reset Password | Kelvin Ikpeni University</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body data-page="reset-password" style="display:grid;place-items:center;min-height:100vh;background:var(--gradient-brand);padding-block:var(--space-6);">

  <div style="width:100%;max-width:460px;padding:var(--space-5);">
    <a href="/" class="logo" style="justify-content:center;color:#fff;margin-bottom:var(--space-5);">
      <span class="logo__crest">K</span>
      <span class="logo__text">
        <span class="logo__name" style="background:linear-gradient(135deg,#fff,var(--color-accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;">Kelvin Ikpeni</span>
        <span class="logo__sub" style="color:rgba(255,255,255,0.6);">University</span>
      </span>
    </a>

    <div class="card" style="padding:var(--space-7);border-top:4px solid var(--color-accent);">
      <h1 style="font-size:1.65rem;margin-bottom:var(--space-2);">Set a New Password</h1>
      <p class="text-muted" style="font-size:var(--fs-sm);margin-bottom:var(--space-6);">
        Choose a strong password of at least 8 characters with uppercase, lowercase, and a number.
      </p>

      <form id="resetForm">
        <div class="form-group">
          <label class="form-label" for="password">New Password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" class="form-control" required minlength="8" autocomplete="new-password" />
            <button type="button" class="password-toggle" data-toggle-password aria-label="Show password"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn--accent btn--lg btn--block" id="resetBtn">
          <i class="fas fa-key"></i> Reset Password
        </button>
      </form>

      <div class="text-center mt-5" style="font-size:var(--fs-sm);">
        <a href="/pages/login.html" style="font-weight:600;">Back to Sign In</a>
      </div>
    </div>

    <div class="text-center mt-5">
      <a href="/" style="color:rgba(255,255,255,0.75);font-size:var(--fs-sm);"><i class="fas fa-arrow-left"></i> Back to home</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/auth-pages.js"></script>
</body>
</html>
