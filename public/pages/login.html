<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in to your Kelvin Ikpeni University portal — students, staff, and applicants." />
  <title>Sign In | Kelvin Ikpeni University</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/css/global.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body data-page="login" style="display:grid;place-items:center;min-height:100vh;background:var(--gradient-brand);">

  <div style="width:100%;max-width:440px;padding:var(--space-5);">
    <a href="/" class="logo" style="justify-content:center;color:#fff;margin-bottom:var(--space-5);">
      <span class="logo__crest">K</span>
      <span class="logo__text">
        <span class="logo__name" style="background:linear-gradient(135deg,#fff,var(--color-accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;">Kelvin Ikpeni</span>
        <span class="logo__sub" style="color:rgba(255,255,255,0.6);">University</span>
      </span>
    </a>

    <div class="card" style="padding:var(--space-7);border-top:4px solid var(--color-accent);">
      <h1 style="font-size:1.75rem;margin-bottom:var(--space-2);">Welcome back</h1>
      <p class="text-muted" style="font-size:var(--fs-sm);margin-bottom:var(--space-6);">Sign in to access your portal.</p>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password" />
            <button type="button" class="password-toggle" data-toggle-password aria-label="Show password"><i class="fas fa-eye"></i></button>
          </div>
        </div>

        <div class="flex justify-between items-center mb-5 flex-wrap gap-2">
          <label class="form-check" style="align-items:center;">
            <input type="checkbox" id="remember" />
            <span style="font-size:var(--fs-sm);">Remember me</span>
          </label>
          <a href="/pages/forgot-password.html" style="font-size:var(--fs-sm);">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn--accent btn--lg btn--block" id="loginBtn">
          <i class="fas fa-right-to-bracket"></i> Sign In
        </button>
      </form>

      <div class="text-center mt-5" style="font-size:var(--fs-sm);">
        Don't have an account? <a href="/pages/register.html" style="font-weight:600;">Create one</a>
      </div>
    </div>

    <div class="text-center mt-5">
      <a href="/" style="color:rgba(255,255,255,0.75);font-size:var(--fs-sm);"><i class="fas fa-arrow-left"></i> Back to home</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/auth-pages.js"></script>
</body>
</html>
